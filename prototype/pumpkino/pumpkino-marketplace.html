<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pumpkino — DMC Marketplace</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  :root{
    --primary:#0D3B2F; --primary-deep:#0A3026; --secondary:#D8A43B;
    --bg:#F8F7F3; --card:#FFFFFF; --border:#E9E5DD;
    --heading:#16221D; --body:#5E625F; --muted:#8E948E;
    --success:#2F8F5B; --success-bg:#E7F3EA;
    --warning:#E39A22; --warning-bg:#FCF0DC;
    --danger:#D9534F; --danger-bg:#FBEAE9;
    --ai:#7B5CFA; --ai-bg:#EFEAFE;
    --info:#3B82F6; --info-bg:#E8F1FE;
    --r-btn:12px; --r-card:18px; --r-dialog:20px; --r-input:10px; --r-badge:999px;
    --shadow-sm:0 4px 12px rgba(0,0,0,.04);
    --shadow-md:0 8px 24px rgba(0,0,0,.06);
    --shadow-lg:0 24px 60px rgba(0,0,0,.16);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); font-family:'Inter',sans-serif; color:var(--body); font-size:14.5px; line-height:1.5;}

  .topbar{display:flex; align-items:center; justify-content:space-between; padding:16px 32px; background:var(--card); border-bottom:1px solid var(--border);}
  .logo{display:flex; align-items:center; gap:10px;}
  .logo .mark{width:32px;height:32px;border-radius:9px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--secondary);font-size:14px;}
  .logo .word{font-weight:700;font-size:16.5px;color:var(--heading);}
  .topbar a{color:var(--primary); font-weight:600; text-decoration:none; font-size:12.5px; margin-left:16px;}

  .wrap{max-width:1080px; margin:0 auto; padding:28px 24px 70px;}
  .page-head h1{font-size:24px; font-weight:800; color:var(--heading); margin:0 0 4px;}
  .page-head .sub{font-size:13px; color:var(--muted); margin-bottom:20px;}

  .toolbar{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .toolbar input.search{flex:1; min-width:200px; padding:11px 14px; border:1px solid var(--border); border-radius:var(--r-input); font-size:13.5px; font-family:inherit;}
  .toolbar select{padding:11px 12px; border:1px solid var(--border); border-radius:var(--r-input); font-size:13px; font-family:inherit; background:var(--card);}

  .result-count{font-size:12.5px; color:var(--muted); margin-bottom:14px;}

  .dmc-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .dmc-card{background:var(--card); border:1px solid var(--border); border-radius:var(--r-card); padding:20px; display:flex; flex-direction:column;}
  .dmc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
  .dmc-name{font-size:15px; font-weight:800; color:var(--heading);}
  .dmc-loc{font-size:12px; color:var(--muted); margin-top:2px;}
  .verified-badge{background:var(--success-bg); color:var(--success); font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:var(--r-badge); white-space:nowrap;}
  .unverified-badge{background:var(--bg); color:var(--muted); font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:var(--r-badge); white-space:nowrap;}

  .stars{color:var(--secondary); font-size:13px; letter-spacing:1px;}
  .rating-row{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--body); margin:6px 0 10px;}
  .rating-row b{color:var(--heading);}
  .no-reviews{font-size:12px; color:var(--muted); margin:6px 0 10px;}

  .chip-row{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
  .chip{background:var(--bg); border:1px solid var(--border); border-radius:var(--r-badge); font-size:11px; font-weight:600; color:var(--body); padding:4px 10px;}

  .dmc-desc{font-size:12.5px; color:var(--body); margin-bottom:12px; flex:1;}

  .trust-row{display:flex; gap:14px; font-size:11.5px; color:var(--muted); margin-bottom:14px; flex-wrap:wrap;}
  .trust-row span b{color:var(--heading);}

  .dmc-actions{display:flex; gap:8px;}
  .dmc-actions button{flex:1; border:none; border-radius:var(--r-btn); padding:10px 12px; font-size:12.5px; font-weight:700; cursor:pointer;}
  .btn-primary{background:var(--primary); color:#fff;}
  .btn-primary:hover{background:var(--primary-deep);}
  .btn-outline{background:transparent; border:1px solid var(--primary) !important; color:var(--primary);}

  .empty-state{background:var(--card); border:1px dashed var(--border); border-radius:var(--r-card); padding:34px; text-align:center; color:var(--muted); font-size:13px; grid-column:1/-1;}

  .sub-banner{display:flex; align-items:center; justify-content:space-between; gap:14px; border-radius:var(--r-card); padding:13px 18px; margin-bottom:18px; border:1px solid; flex-wrap:wrap; font-size:12.5px;}
  .sub-banner.locked{background:var(--warning-bg); border-color:rgba(227,154,34,.35); color:#8A5A0F;}
  .sub-banner.unlocked{background:var(--success-bg); border-color:rgba(47,143,91,.3); color:var(--success);}
  .sub-banner b{font-weight:800;}
  .sub-banner .toggle-demo{background:var(--card); border:1px solid currentColor; border-radius:var(--r-btn); padding:7px 13px; font-size:12px; font-weight:700; cursor:pointer; color:inherit; white-space:nowrap;}
  .dmc-name.masked{color:var(--muted); font-style:italic;}
  .lock-tag{font-size:10.5px; font-weight:700; color:var(--warning); background:var(--warning-bg); padding:2px 8px; border-radius:var(--r-badge); margin-left:6px; white-space:nowrap;}
  .btn-locked{background:var(--bg) !important; color:var(--muted) !important; cursor:pointer;}

  .overlay{position:fixed; inset:0; background:rgba(13,59,47,.35); display:none; align-items:center; justify-content:center; z-index:50; padding:20px;}
  .overlay.show{display:flex;}
  .modal{background:var(--card); border-radius:var(--r-dialog); padding:26px; width:480px; max-width:100%; box-shadow:var(--shadow-lg); max-height:88vh; overflow-y:auto;}
  .modal h2{font-size:17px; font-weight:800; color:var(--heading); margin:0 0 4px;}
  .modal .m-sub{font-size:12px; color:var(--muted); margin-bottom:16px;}
  .field-lbl{font-size:12px; font-weight:600; color:var(--body); display:block; margin-bottom:5px;}
  .field-in, textarea.field-in{width:100%; padding:9px 12px; border:1px solid var(--border); border-radius:var(--r-input); font-size:13px; margin-bottom:12px; font-family:inherit;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-actions button{flex:1; border:none; border-radius:var(--r-btn); padding:11px; font-size:13px; font-weight:700; cursor:pointer;}
  .modal-actions .cancel{background:var(--bg); color:var(--body);}
  .modal-actions .confirm{background:var(--primary); color:#fff;}
  .star-picker{display:flex; gap:6px; margin-bottom:14px;}
  .star-picker span{font-size:22px; cursor:pointer; color:var(--border);}
  .star-picker span.on{color:var(--secondary);}
  .review-item{border-top:1px solid var(--border); padding:10px 0; font-size:12.5px;}
  .review-item:first-child{border-top:none;}
  .review-item .rv-top{display:flex; justify-content:space-between; font-weight:700; color:var(--heading);}
  .review-item .rv-date{font-weight:400; color:var(--muted); font-size:11px;}
  .success-note{background:var(--success-bg); color:var(--success); border-radius:var(--r-input); padding:12px 14px; font-size:13px; font-weight:600; text-align:center;}

  @media (max-width:760px){
    .dmc-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><div class="mark">P</div><div class="word">pumpkino</div></div>
  <div>
    <a href="pumpkino-onboarding.html?role=agent">← Back to onboarding</a>
    <a href="pumpkino-subscription.html">Subscription</a>
    <a href="pumpkino-profile.html">Profile</a>
    <a href="pumpkino-login.html">Log out</a>
  </div>
</div>

<div class="wrap">
  <div class="page-head">
    <h1>DMC Marketplace</h1>
    <div class="sub">Find and connect with verified Destination Management Companies across your target markets.</div>
  </div>

  <div id="subBannerWrap"></div>

  <div class="toolbar">
    <input class="search" id="mktSearch" placeholder="Search by DMC name or destination…" oninput="onMktChange()">
    <select id="mktDest" onchange="onMktChange()">
      <option value="all">All destinations</option>
    </select>
    <select id="mktService" onchange="onMktChange()">
      <option value="all">All services</option>
    </select>
    <select id="mktSort" onchange="onMktChange()">
      <option value="rating">Sort: Highest rated</option>
      <option value="bookings">Sort: Most bookings</option>
      <option value="response">Sort: Fastest response</option>
    </select>
  </div>

  <div class="result-count" id="resultCount"></div>
  <div class="dmc-grid" id="dmcGrid"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>

<script>
(function(){
  var dmcs = [
    {id:1, name:'Kerala Tour Mart DMC', city:'Kochi', country:'India', destinations:['Kerala','Backwaters'], services:['Hotels','Houseboats','Transport','Guides'],
      verified:true, bookings:210, responseHrs:2, desc:'Full-service DMC covering Kerala backwaters, hill stations and beaches, with strong houseboat inventory in Alleppey and Kumarakom.',
      reviews:[
        {agency:'Trekking Miles Holidays', rating:5, comment:'Fast confirmations and great houseboat options. Our go-to Kerala partner.', date:'02 Jul 2026'},
        {agency:'Blue Horizon Travels', rating:5, comment:'Reliable inventory blocking and clear communication throughout.', date:'19 Jun 2026'},
        {agency:'Wanderlust Corp Travel', rating:4, comment:'Good rates, occasionally slow on weekends.', date:'30 May 2026'}
      ]},
    {id:2, name:'Coastal Karnataka DMC', city:'Mangalore', country:'India', destinations:['Karnataka','Coastal Karnataka'], services:['Hotels','Transport','Activities & Tours'],
      verified:false, bookings:48, responseHrs:6, desc:'Boutique DMC specializing in coastal Karnataka — Gokarna, Udupi and Mangalore beach circuits.',
      reviews:[
        {agency:'Spice Coast Travels', rating:4, comment:'Good local knowledge, decent response time.', date:'10 Jun 2026'},
        {agency:'Golden Route Holidays', rating:4.5, comment:'Great value for beach itineraries.', date:'22 May 2026'}
      ]},
    {id:3, name:'Gulf Experience DMC', city:'Abu Dhabi', country:'UAE', destinations:['UAE','Abu Dhabi','Dubai'], services:['Hotels','Transport','Activities & Tours','Visa Assistance'],
      verified:true, bookings:340, responseHrs:1, desc:'Premium UAE inbound DMC handling luxury hotels, desert safaris and visa assistance for international agencies.',
      reviews:[
        {agency:'Desert Rose Journeys', rating:5, comment:'Exceptional response time and visa support saved us so much back-and-forth.', date:'28 Jun 2026'},
        {agency:'Trekking Miles Holidays', rating:5, comment:'Best UAE DMC we have worked with on Pumpkino.', date:'14 Jun 2026'},
        {agency:'Blue Horizon Travels', rating:4.5, comment:'Premium service, premium pricing — worth it for high-end clients.', date:'01 Jun 2026'}
      ]},
    {id:4, name:'Siam Discovery DMC', city:'Bangkok', country:'Thailand', destinations:['Thailand','Bangkok','Phuket'], services:['Hotels','Transport','Activities & Tours','Guides'],
      verified:false, bookings:76, responseHrs:4, desc:'Thailand-based DMC covering Bangkok city breaks and Phuket beach packages with English-speaking guides.',
      reviews:[
        {agency:'Wanderlust Corp Travel', rating:4, comment:'Solid itineraries, would like faster quote turnaround.', date:'05 Jul 2026'},
        {agency:'Golden Route Holidays', rating:4.5, comment:'Great guides and well-organized tours.', date:'21 Jun 2026'}
      ]},
    {id:5, name:'Rajasthan Heritage DMC', city:'Jaipur', country:'India', destinations:['Rajasthan','Jaipur','Udaipur'], services:['Hotels','Transport','Guides','Cultural Tours'],
      verified:true, bookings:190, responseHrs:3, desc:'Heritage-focused DMC with strong palace hotel relationships across Jaipur, Udaipur and Jodhpur.',
      reviews:[
        {agency:'Blue Horizon Travels', rating:5, comment:'Incredible palace hotel access, very professional.', date:'11 Jul 2026'},
        {agency:'Spice Coast Travels', rating:4.5, comment:'Great cultural tour guides, good communication.', date:'02 Jun 2026'}
      ]},
    {id:6, name:'Goa Coastal Getaways DMC', city:'Panaji', country:'India', destinations:['Goa'], services:['Hotels','Transport','Activities & Tours','Houseboats'],
      verified:true, bookings:33, responseHrs:5, desc:'Goa specialist DMC covering beach resorts, water sports and nightlife packages for leisure travelers.',
      reviews:[
        {agency:'Wanderlust Corp Travel', rating:4, comment:'Good beach resort options, response could be quicker.', date:'15 Jun 2026'}
      ]},
    {id:7, name:'Himalayan Trails DMC', city:'Manali', country:'India', destinations:['Himachal','Kashmir','Ladakh'], services:['Hotels','Transport','Guides','Trekking'],
      verified:false, bookings:5, responseHrs:8, desc:'New-to-Pumpkino DMC covering Himalayan trekking circuits across Himachal, Kashmir and Ladakh.',
      reviews:[]}
  ];

  var filterState = {search:'', dest:'all', service:'all', sort:'rating'};

  // Subscription gate: only agencies with an active PAID subscription (Starter/
  // Growth/Scale) see a DMC's real name and can send a quote request. Trial and
  // unsubscribed agencies see destination-level info only — enough to evaluate
  // fit, not enough to identify and contact the DMC outside Pumpkino. Persisted
  // via localStorage (demo-only) so the state carries over to the detail page.
  function isSubscribed(){ return window.localStorage.getItem('pumpkinoAgencySubscribed') === 'true'; }
  window.toggleSubscribed = function(){
    window.localStorage.setItem('pumpkinoAgencySubscribed', isSubscribed() ? 'false' : 'true');
    renderSubBanner();
    renderGrid();
  };

  function renderSubBanner(){
    var subscribed = isSubscribed();
    document.getElementById('subBannerWrap').innerHTML =
      '<div class="sub-banner '+(subscribed?'unlocked':'locked')+'">' +
        '<span>'+(subscribed ?
          '✓ <b>Subscribed</b> — DMC names, exact locations and quote requests are unlocked.' :
          '🔒 <b>Not subscribed</b> — you can browse destinations and services, but DMC names and quote requests are unlocked only on a paid plan. <a href="pumpkino-pricing.html" style="color:inherit; font-weight:800;">See plans →</a>') +
        '</span>' +
        '<button class="toggle-demo" onclick="toggleSubscribed()">🧪 Demo: switch to '+(subscribed?'unsubscribed':'subscribed')+' view</button>' +
      '</div>';
  }

  function avgRating(dmc){
    if(!dmc.reviews.length) return null;
    var sum = dmc.reviews.reduce(function(s,r){return s+r.rating;},0);
    return sum/dmc.reviews.length;
  }

  function starString(avg){
    if(avg===null) return '';
    var full = Math.round(avg);
    return '★★★★★'.slice(0,full) + '☆☆☆☆☆'.slice(0, 5-full);
  }

  function populateFilterOptions(){
    var destSet = {}, serviceSet = {};
    dmcs.forEach(function(d){
      d.destinations.forEach(function(x){destSet[x]=true;});
      d.services.forEach(function(x){serviceSet[x]=true;});
    });
    var destSel = document.getElementById('mktDest');
    Object.keys(destSet).sort().forEach(function(d){
      var opt = document.createElement('option'); opt.value = d; opt.textContent = d;
      destSel.appendChild(opt);
    });
    var svcSel = document.getElementById('mktService');
    Object.keys(serviceSet).sort().forEach(function(s){
      var opt = document.createElement('option'); opt.value = s; opt.textContent = s;
      svcSel.appendChild(opt);
    });
  }

  window.onMktChange = function(){
    filterState.search = document.getElementById('mktSearch').value.toLowerCase();
    filterState.dest = document.getElementById('mktDest').value;
    filterState.service = document.getElementById('mktService').value;
    filterState.sort = document.getElementById('mktSort').value;
    renderGrid();
  };

  function renderGrid(){
    var subscribed = isSubscribed();
    var filtered = dmcs.filter(function(d){
      var matchesSearch = !filterState.search ||
        (subscribed && d.name.toLowerCase().indexOf(filterState.search)>=0) ||
        d.destinations.join(' ').toLowerCase().indexOf(filterState.search)>=0 ||
        d.services.join(' ').toLowerCase().indexOf(filterState.search)>=0;
      var matchesDest = filterState.dest==='all' || d.destinations.indexOf(filterState.dest)>=0;
      var matchesService = filterState.service==='all' || d.services.indexOf(filterState.service)>=0;
      return matchesSearch && matchesDest && matchesService;
    });

    filtered.sort(function(a,b){
      if(filterState.sort==='bookings') return b.bookings - a.bookings;
      if(filterState.sort==='response') return a.responseHrs - b.responseHrs;
      var ra = avgRating(a), rb = avgRating(b);
      return (rb||0) - (ra||0);
    });

    document.getElementById('resultCount').textContent = filtered.length + ' DMC' + (filtered.length===1?'':'s') + ' found';

    var grid = document.getElementById('dmcGrid');
    if(!filtered.length){
      grid.innerHTML = '<div class="empty-state">No DMCs match your search/filters. Try a different destination or service.</div>';
      return;
    }

    grid.innerHTML = filtered.map(function(d){
      var avg = avgRating(d);
      var ratingHtml = avg!==null
        ? '<div class="rating-row"><span class="stars">'+starString(avg)+'</span><b>'+avg.toFixed(1)+'</b><span>('+d.reviews.length+' review'+(d.reviews.length===1?'':'s')+')</span></div>'
        : '<div class="no-reviews">No reviews yet</div>';
      var chipsHtml = d.services.map(function(s){return '<span class="chip">'+s+'</span>';}).join('');
      var displayName = subscribed ? d.name : (d.verified ? '✓ Verified DMC' : 'Unverified DMC') + ' — '+d.destinations[0];
      var locLine = subscribed ? (d.city+', '+d.country+' · '+d.destinations.join(', ')) : (d.country+' · '+d.destinations.join(', '));
      var actionsHtml = subscribed ?
        ('<a class="btn-outline" style="text-align:center; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;" href="pumpkino-dmc-detail.html?id='+d.id+'">View profile & packages</a>' +
         '<button class="btn-primary" onclick="openQuoteRequest('+d.id+')">Send quote request</button>')
        :
        ('<a class="btn-outline" style="text-align:center; text-decoration:none; display:inline-flex; align-items:center; justify-content:center;" href="pumpkino-dmc-detail.html?id='+d.id+'">View destination details</a>' +
         '<button class="btn-primary btn-locked" onclick="window.location.href=\'pumpkino-pricing.html\'">🔒 Subscribe to unlock</button>');
      return '<div class="dmc-card">' +
        '<div class="dmc-top"><div><div class="dmc-name'+(subscribed?'':' masked')+'">'+displayName+'</div><div class="dmc-loc">'+locLine+'</div></div>' +
          '<span class="'+(d.verified?'verified-badge':'unverified-badge')+'">'+(d.verified?'✓ Verified':'Unverified')+'</span></div>' +
        ratingHtml +
        '<div class="chip-row">'+chipsHtml+'</div>' +
        '<div class="dmc-desc">'+d.desc+'</div>' +
        '<div class="trust-row"><span><b>'+d.bookings+'+</b> bookings</span><span>Responds within <b>'+d.responseHrs+'h</b></span></div>' +
        '<div class="dmc-actions">' +
          actionsHtml +
        '</div>' +
      '</div>';
    }).join('');
  }

  window.openProfile = function(id){
    var d = dmcs.find(function(x){return x.id===id;});
    var avg = avgRating(d);
    var reviewsHtml = d.reviews.length ? d.reviews.map(function(r){
      return '<div class="review-item"><div class="rv-top"><span>'+r.agency+'</span><span class="rv-date">'+r.date+'</span></div><div class="stars">'+starString(r.rating)+'</div><div>'+r.comment+'</div></div>';
    }).join('') : '<div class="no-reviews">No reviews yet — be the first to leave one.</div>';

    showModal(
      '<h2>'+d.name+'</h2>' +
      '<div class="m-sub">'+d.city+', '+d.country+' · '+(d.verified?'✓ Verified business':'Not yet verified')+'</div>' +
      '<div class="dmc-desc" style="margin-bottom:14px;">'+d.desc+'</div>' +
      '<div class="trust-row" style="margin-bottom:16px;"><span><b>'+d.bookings+'+</b> bookings completed</span><span>Responds within <b>'+d.responseHrs+'h</b></span>' +
        (avg!==null ? '<span><b>'+avg.toFixed(1)+'</b>★ ('+d.reviews.length+')</span>' : '') + '</div>' +
      '<div style="font-weight:800; font-size:13px; color:var(--heading); margin-bottom:8px;">Reviews</div>' +
      reviewsHtml +
      '<div class="modal-actions" style="margin-top:16px;">' +
        '<button class="cancel" onclick="openReviewForm('+d.id+')">Leave a review</button>' +
        '<button class="confirm" onclick="closeModal(); openQuoteRequest('+d.id+')">Send quote request</button>' +
      '</div>'
    );
  };

  window.openReviewForm = function(id){
    var d = dmcs.find(function(x){return x.id===id;});
    showModal(
      '<h2>Review '+d.name+'</h2>' +
      '<div class="m-sub">Shared publicly with other agencies on the marketplace.</div>' +
      '<label class="field-lbl">Your rating</label>' +
      '<div class="star-picker" id="starPicker">' +
        [1,2,3,4,5].map(function(n){ return '<span data-n="'+n+'" onclick="setStarRating('+n+')">★</span>'; }).join('') +
      '</div>' +
      '<label class="field-lbl">Your review</label>' +
      '<textarea class="field-in" id="reviewComment" rows="3" placeholder="Share your experience working with this DMC…"></textarea>' +
      '<div class="modal-actions">' +
        '<button class="cancel" onclick="openProfile('+id+')">Cancel</button>' +
        '<button class="confirm" onclick="submitReview('+id+')">Submit review</button>' +
      '</div>'
    );
    window._pendingRating = 5;
    setStarRating(5);
  };

  window.setStarRating = function(n){
    window._pendingRating = n;
    document.querySelectorAll('#starPicker span').forEach(function(s){
      s.classList.toggle('on', Number(s.getAttribute('data-n')) <= n);
    });
  };

  window.submitReview = function(id){
    var d = dmcs.find(function(x){return x.id===id;});
    var comment = document.getElementById('reviewComment').value.trim();
    if(!comment){ alert('Please write a short review before submitting.'); return; }
    d.reviews.unshift({agency:'Trekking Miles Holidays', rating:window._pendingRating, comment:comment, date: todayLabel()});
    renderGrid();
    openProfile(id);
  };

  window.openQuoteRequest = function(id){
    var d = dmcs.find(function(x){return x.id===id;});
    showModal(
      '<h2>Send quote request — '+d.name+'</h2>' +
      '<div class="m-sub">This creates a new connection between your agency and this DMC.</div>' +
      '<div class="grid2">' +
        '<div><label class="field-lbl">Destination</label><input class="field-in" id="qrDest" value="'+d.destinations[0]+'"></div>' +
        '<div><label class="field-lbl">Travel dates</label><input class="field-in" id="qrDates" placeholder="e.g. 12-16 Aug 2026"></div>' +
      '</div>' +
      '<div class="grid2">' +
        '<div><label class="field-lbl">Travelers (pax)</label><input class="field-in" id="qrPax" placeholder="e.g. 2 adults" value="2 adults"></div>' +
        '<div><label class="field-lbl">Budget (approx.)</label><input class="field-in" id="qrBudget" placeholder="e.g. ₹40,000"></div>' +
      '</div>' +
      '<label class="field-lbl">Notes for the DMC</label>' +
      '<textarea class="field-in" id="qrNotes" rows="3" placeholder="Any specific requirements…"></textarea>' +
      '<div class="modal-actions">' +
        '<button class="cancel" onclick="closeModal()">Cancel</button>' +
        '<button class="confirm" onclick="confirmQuoteRequest('+id+')">Send request</button>' +
      '</div>'
    );
  };

  window.confirmQuoteRequest = function(id){
    var d = dmcs.find(function(x){return x.id===id;});
    showModal(
      '<h2>Request sent</h2>' +
      '<div class="success-note">✓ Your quote request was sent to '+d.name+'. They typically respond within '+d.responseHrs+' hours.</div>' +
      '<div class="modal-actions" style="margin-top:16px;"><button class="confirm" style="width:100%;" onclick="closeModal()">Done</button></div>'
    );
  };

  function todayLabel(){
    var d = new Date();
    var months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear();
  }

  function showModal(html){
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('overlay').classList.add('show');
  }
  window.closeModal = function(){ document.getElementById('overlay').classList.remove('show'); };
  document.getElementById('overlay').addEventListener('click', function(e){
    if(e.target.id==='overlay') window.closeModal();
  });

  populateFilterOptions();
  renderSubBanner();
  renderGrid();
})();
</script>
</body>
</html>
