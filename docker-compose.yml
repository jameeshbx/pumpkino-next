name: pumpkino

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pumpkino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pumpkino_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-pumpkino}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pumpkino_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pumpkino} -d ${POSTGRES_DB:-pumpkino}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pumpkino

  # One-shot service: waits for the DB, applies Prisma migrations and seeds.
  # After `docker compose up -d` the database is immediately usable.
  migrate:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-pumpkino}:${POSTGRES_PASSWORD:-pumpkino_dev_password}@db:5432/${POSTGRES_DB:-pumpkino}?schema=public"
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-ops@pumpkino.test}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe!Ops2026}
    volumes:
      - ./:/app
      - migrate_node_modules:/app/node_modules
    command: >
      sh -c "npm ci --no-audit --no-fund &&
             npx prisma migrate deploy &&
             npx prisma db seed"
    networks:
      - pumpkino

volumes:
  pumpkino_pgdata:
  migrate_node_modules:

networks:
  pumpkino:
    driver: bridge
